<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 438" width="360" height="438" role="img" aria-label="Decode speed in tokens per second: plain offloading 10.77, with a gather kernel 13.53, with a cache of the busiest experts 16.50 at peak, 14.99 as shipped; router pruning reached 20.48 but was not shipped because it hurt the output.">
<rect width="360" height="438" rx="10" fill="#0f172a" stroke="#1e293b"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',Helvetica,Arial,sans-serif">
<text x="16" y="30" font-size="17" font-weight="700" fill="#f8fafc">Decode speed, tokens per second</text>
<text x="16" y="50" font-size="12" fill="#94a3b8">GLM-5.3-Flash on one GPU, one request at a time.</text>
<text x="16" y="65" font-size="12" fill="#94a3b8">Each bar is a separately measured setup (Sep 2026).</text>
<text x="16" y="98" font-size="13" fill="#e2e8f0">Plain offloading</text>
<rect x="16" y="106" width="122.3" height="22" rx="3" fill="#64748b"/>
<text x="146.3" y="122" font-size="15" font-weight="700" fill="#f8fafc">10.77</text>
<text x="16" y="164" font-size="13" fill="#e2e8f0">+ gather kernel (wide expert reads)</text>
<rect x="16" y="172" width="153.7" height="22" rx="3" fill="#64748b"/>
<text x="177.7" y="188" font-size="15" font-weight="700" fill="#f8fafc">13.53</text>
<text x="16" y="230" font-size="13" fill="#e2e8f0">+ cache of the busiest experts (peak)</text>
<rect x="16" y="238" width="187.4" height="22" rx="3" fill="#cbd5e1"/>
<text x="211.4" y="254" font-size="15" font-weight="700" fill="#f8fafc">16.50</text>
<text x="16" y="296" font-size="13" fill="#e2e8f0">As shipped (room for long prompts)</text>
<rect x="16" y="304" width="170.3" height="22" rx="3" fill="#fbbf24"/>
<text x="194.3" y="320" font-size="15" font-weight="700" fill="#fbbf24">14.99</text>
<text x="16" y="362" font-size="13" fill="#e2e8f0">Router pruning (not shipped: hurt output)</text>
<rect x="16" y="370" width="232.7" height="22" rx="3" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
<text x="256.7" y="386" font-size="15" font-weight="700" fill="#94a3b8">20.48</text>
<text x="16" y="424" font-size="11" fill="#94a3b8">Source: github.com/pctablet505/glm53-flash-single-gpu</text>
</g></svg>
