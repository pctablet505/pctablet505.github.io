<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Decode speed in tokens per second: plain offloading 10.77, with a gather kernel 13.53, with a cache of the busiest experts 16.50 at peak, 14.99 as shipped; router pruning reached 20.48 but was not shipped because it hurt the output.">
<rect width="880" height="420" rx="10" fill="#0f172a" stroke="#1e293b"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',Helvetica,Arial,sans-serif">
<text x="28" y="38" font-size="21" font-weight="700" fill="#f8fafc">Decode speed, tokens per second</text>
<text x="28" y="62" font-size="13.5" fill="#94a3b8">GLM-5.3-Flash on one GPU, one request at a time. Each bar is a separately measured setup (September 2026).</text>
<line x1="70" y1="330.0" x2="856" y2="330.0" stroke="#334155"/>
<text x="60" y="334.0" font-size="12" fill="#94a3b8" text-anchor="end">0</text>
<line x1="70" y1="282.0" x2="856" y2="282.0" stroke="#334155" stroke-dasharray="3 4"/>
<text x="60" y="286.0" font-size="12" fill="#94a3b8" text-anchor="end">5</text>
<line x1="70" y1="234.0" x2="856" y2="234.0" stroke="#334155" stroke-dasharray="3 4"/>
<text x="60" y="238.0" font-size="12" fill="#94a3b8" text-anchor="end">10</text>
<line x1="70" y1="186.0" x2="856" y2="186.0" stroke="#334155" stroke-dasharray="3 4"/>
<text x="60" y="190.0" font-size="12" fill="#94a3b8" text-anchor="end">15</text>
<line x1="70" y1="138.0" x2="856" y2="138.0" stroke="#334155" stroke-dasharray="3 4"/>
<text x="60" y="142.0" font-size="12" fill="#94a3b8" text-anchor="end">20</text>
<line x1="70" y1="90.0" x2="856" y2="90.0" stroke="#334155" stroke-dasharray="3 4"/>
<text x="60" y="94.0" font-size="12" fill="#94a3b8" text-anchor="end">25</text>
<rect x="104.6" y="226.6" width="88.0" height="103.4" fill="#64748b" rx="3"/>
<text x="148.6" y="217.6" font-size="17" font-weight="700" fill="#f8fafc" text-anchor="middle">10.77</text>
<text x="148.6" y="354" font-size="13.5" fill="#e2e8f0" text-anchor="middle">Plain offloading</text>
<rect x="261.8" y="200.1" width="88.0" height="129.9" fill="#64748b" rx="3"/>
<text x="305.8" y="191.1" font-size="17" font-weight="700" fill="#f8fafc" text-anchor="middle">13.53</text>
<text x="305.8" y="354" font-size="13.5" fill="#e2e8f0" text-anchor="middle">+ gather kernel</text>
<text x="305.8" y="372" font-size="12.5" fill="#94a3b8" text-anchor="middle">(wide expert reads)</text>
<rect x="419.0" y="171.6" width="88.0" height="158.4" fill="#fbbf24" rx="3"/>
<text x="463.0" y="162.6" font-size="17" font-weight="700" fill="#fbbf24" text-anchor="middle">16.50</text>
<text x="463.0" y="354" font-size="13.5" fill="#e2e8f0" text-anchor="middle">+ cache of the</text>
<text x="463.0" y="372" font-size="12.5" fill="#94a3b8" text-anchor="middle">busiest experts</text>
<rect x="576.2" y="186.1" width="88.0" height="143.9" fill="#cbd5e1" rx="3"/>
<text x="620.2" y="177.1" font-size="17" font-weight="700" fill="#f8fafc" text-anchor="middle">14.99</text>
<text x="620.2" y="354" font-size="13.5" fill="#e2e8f0" text-anchor="middle">As shipped</text>
<text x="620.2" y="372" font-size="12.5" fill="#94a3b8" text-anchor="middle">(room for long prompts)</text>
<rect x="733.4" y="133.4" width="88.0" height="196.6" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" rx="3"/>
<text x="777.4" y="124.4" font-size="17" font-weight="700" fill="#94a3b8" text-anchor="middle">20.48</text>
<text x="777.4" y="354" font-size="13.5" fill="#e2e8f0" text-anchor="middle">Router pruning</text>
<text x="777.4" y="372" font-size="12.5" fill="#94a3b8" text-anchor="middle">not shipped: hurt output</text>
<text x="28" y="402" font-size="12" fill="#94a3b8">Source: github.com/pctablet505/glm53-flash-single-gpu</text>
</g></svg>
